# ============================================================
# YadinStore — CI/CD Demo Stack (local, free tier)
#
# Levanta Jenkins local con Docker-in-Docker para correr el
# Jenkinsfile de este repo. Opcional: Grafana + Prometheus
# (metricas) y ElasticSearch + Kibana (logs) para demostrar
# observabilidad — todos free tier / open source.
#
# Uso:
#   docker compose up -d jenkins            # solo Jenkins
#   docker compose up -d grafana elasticsearch kibana   # observabilidad
#   docker compose up -d filebeat           # shipping ECS JSON -> ES yadinstore-logs-*
#
# Puertos:
#   Jenkins        : http://localhost:8081   (8080 interno; 8090 lo usa kafka-ui)
#   Grafana        : http://localhost:3000  (10.4.3 pinneado — ver docs/grafana.md ChunkLoadError)
#   Kibana         : http://localhost:5601
#   ElasticSearch  : http://localhost:9200
# Troubleshooting:
#   - ES yadinstore-logs-* vacio → ver docs/elasticsearch.md § Diagnostico + filebeat.yml
#   - Grafana ChunkLoadError → docs/grafana.md § Troubleshooting (down -v + pull 10.4.3)
#   - Docker 500 //./pipe/dockerDesktopLinuxEngine → docs/elasticsearch.md § Docker Desktop
# ============================================================

services:
  jenkins:
    build: ./jenkins
    container_name: yadinstore-jenkins
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # DinD: permite docker build
    restart: unless-stopped

  grafana:
    # Pin 10.4.3 — ver docs/grafana.md § Troubleshooting ChunkLoadError:
    # grafana:latest (12.x) rompe chunks React build vs cache navegador + mismatch con ci-cd-infra:10.4.3
    image: grafana/grafana:10.4.3
    container_name: yadinstore-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: yadinstore-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: yadinstore-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Filebeat — shipping ECS JSON -> ES yadinstore-logs-*
  # Opcional local: descomentar para que Filebeat harveste /var/log/yadinstore/*.log
  # Requiere: backend loggeando JSON a ./logs/*.log mount + filebeat.yml en raiz
  # Ver docs/elasticsearch.md § Filebeat. Sin filebeat, usar POST manual (B1) o ring 100 (B2).
  # filebeat:
  #   image: docker.elastic.co/beats/filebeat:8.15.3
  #   container_name: yadinstore-filebeat
  #   user: root
  #   volumes:
  #     - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
  #     - ./logs:/var/log/yadinstore:ro
  #     - filebeat_data:/usr/share/filebeat/data
  #   depends_on:
  #     - elasticsearch
  #   restart: unless-stopped
  #   command: ["-e", "-strict.perms=false"]

volumes:
  jenkins_home:
  grafana_data:
  es_data:
  filebeat_data: